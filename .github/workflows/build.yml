name: build

# Build-only CI. Three modes:
# 1. Direct CI: push to main/master and pull requests catch compile breakage on
#    both target platforms per commit.
# 2. Reusable: release.yml (tag push) and nightly.yml (develop push + cron)
#    call this workflow with inputs.ref, then publish the packaged artifacts.
# 3. Manual: workflow_dispatch.
# There are no unit tests yet - the streaming stack needs real hardware to
# exercise, so verification is the manual matrix described in PLAN.md section 9.
# Since M1 the host is built too, so the full host dependency set from
# PLAN.md section 6 is installed here.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or tag to build (defaults to the triggering ref)
        type: string
        required: false

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          # Full history: the packaging steps version themselves from
          # `git describe --tags`, which sees nothing in a shallow clone.
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-ntldd

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package Windows bundle
        shell: msys2 {0}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/make-zip.ps1

      - name: Build Windows installer
        shell: powershell
        run: |
          function Find-Iscc {
              $found = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              if ($found) { return $found.FullName }
              $cmd = Get-Command ISCC -ErrorAction SilentlyContinue
              if ($cmd) { return $cmd.Source }
              return $null
          }
          # The windows runner image ships Inno Setup; choco is only a fallback
          # for images that drop it.
          $isccPath = Find-Iscc
          if (-not $isccPath) {
              choco install innosetup --no-progress -y
              $isccPath = Find-Iscc
          }
          if (-not $isccPath) { throw "ISCC.exe not found, and 'choco install innosetup' did not provide it" }
          # No version defines here: installer.iss includes
          # build\packaging\windows\version.iss, which the Configure step wrote
          # from cmake/CosmicDeskVersion.cmake.
          & $isccPath packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: cosmicdesk-windows-x64
          path: dist/CosmicDesk-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cosmicdesk-windows-x64-setup
          path: dist/CosmicDesk-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          # Full history: the packaging steps version themselves from
          # `git describe --tags`, which sees nothing in a shallow clone.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git dpkg-dev \
            libsdl2-dev nlohmann-json3-dev \
            libavcodec-dev libavutil-dev libswscale-dev libavfilter-dev \
            libssl-dev libcurl4-openssl-dev libexpat1-dev libopus-dev \
            uuid-dev \
            libboost-dev libboost-log-dev libboost-locale-dev libboost-program-options-dev \
            libx11-dev libxfixes-dev libxrandr-dev libxtst-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libdrm-dev libcap-dev libevdev-dev libudev-dev \
            libpulse-dev libva-dev \
            libayatana-appindicator3-dev libgtk-3-dev libnotify-dev \
            python3-pip python3-setuptools

      - name: Install Python build deps
        run: sudo pip install --break-system-packages jinja2 setuptools

      - name: Configure
        # /usr prefix so the .desktop Exec path matches where the deb installs.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Package Linux tarball
        run: bash packaging/linux/make-tarball.sh

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: cosmicdesk-linux-x64
          path: build/dist-linux/cosmicdesk-linux-x64.tar.gz
          if-no-files-found: error

      - name: Package Linux deb
        run: bash packaging/linux/make-deb.sh

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: cosmicdesk-linux-deb
          path: build/dist-deb/cosmicdesk_*_amd64.deb
          if-no-files-found: error
