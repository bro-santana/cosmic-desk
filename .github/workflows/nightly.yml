name: nightly

# Nightly builds from the develop branch. The cron runs on the DEFAULT branch's
# workflow file, which is why the build passes ref=develop explicitly: the
# nightly must always build develop, not whatever branch is default.
on:
  push:
    branches: [develop]
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

# A develop push and the nightly cron can overlap; serializing them keeps the
# release update (delete-then-recreate) from racing itself.
concurrency: nightly

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: develop

  nightly:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Update nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly build
          body: Nightly build from the develop branch.
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          omitBodyDuringUpdate: true
          artifacts: "artifacts/*"
